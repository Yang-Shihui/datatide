name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["22", "24"]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: testdb
        ports:
          - 15432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Seed postgres test table
        run: |
          PGPASSWORD=test psql -h 127.0.0.1 -U test -d testdb -c "CREATE TABLE IF NOT EXISTS orders(id int, region text, amount numeric); TRUNCATE orders; INSERT INTO orders VALUES (1,'huadong',100),(2,'huabei',80);"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
        env:
          DATATIDE_TEST_PG_DSN: host=127.0.0.1 port=15432 user=test password=test dbname=testdb

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: webui/package-lock.json
      - run: npm ci
        working-directory: webui
      - run: npm run build
        working-directory: webui
